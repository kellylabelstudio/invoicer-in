name: Windows beta

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select stable Rust
        run: rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build
      - name: Verify Start menu shortcut on install and update
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not built.' }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Invoicer-in.lnk'
          $shell = New-Object -ComObject WScript.Shell
          function Install-Invoicer([string[]] $Flags) {
            $result = Start-Process -FilePath $installer.FullName -ArgumentList $Flags -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)." }
            if (-not (Test-Path -LiteralPath $link -PathType Leaf)) { throw 'Start menu entry is missing.' }
            $target = $shell.CreateShortcut($link).TargetPath
            if ((Split-Path -Leaf $target) -ne 'invoicer-in.exe' -or -not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw 'Start menu entry does not point to the installed app.'
            }
          }
          Install-Invoicer -Flags @('/S')
          Remove-Item -LiteralPath $link
          Install-Invoicer -Flags @('/S', '/UPDATE')
      - uses: actions/upload-artifact@v4
        with:
          name: invoicer-in-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: invoicer-in-windows-x64
          path: installer
      - name: Draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INVOICE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$INVOICE_TAG" installer/*-setup.exe \
            --verify-tag --draft --prerelease --title "Invoicer-in $INVOICE_TAG" \
            --notes "Windows x64 beta. See the project README for scope, setup and testing notes."
