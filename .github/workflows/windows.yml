name: Windows beta

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select stable Rust
        run: rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build
      - uses: actions/upload-artifact@v4
        with:
          name: invoicer-in-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: invoicer-in-windows-x64
          path: installer
      - name: Draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INVOICE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$INVOICE_TAG" installer/*-setup.exe \
            --verify-tag --draft --prerelease --title "Invoicer-in $INVOICE_TAG" \
            --notes "Windows x64 beta. See the project README for scope, setup and testing notes."
