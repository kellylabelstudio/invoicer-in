name: Windows beta

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Select stable Rust
        run: rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run tauri -- build
      - name: Verify renamed installer, Start menu and app launch
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not built.' }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'Invoicer In.lnk'
          $shell = New-Object -ComObject WScript.Shell
          function Install-Invoicer([string[]] $Flags) {
            $result = Start-Process -FilePath $installer.FullName -ArgumentList $Flags -Wait -PassThru
            if ($result.ExitCode -ne 0) { throw "Installer exited with $($result.ExitCode)." }
            if (-not (Test-Path -LiteralPath $link -PathType Leaf)) { throw 'Start menu entry is missing.' }
            $target = $shell.CreateShortcut($link).TargetPath
            if ((Split-Path -Leaf $target) -ne 'invoicer-in.exe' -or -not (Test-Path -LiteralPath $target -PathType Leaf)) {
              throw 'Start menu entry does not point to the installed app.'
            }
            return $target
          }
          $null = Install-Invoicer -Flags @('/S')
          Remove-Item -LiteralPath $link
          $fresh = Install-Invoicer -Flags @('/S', '/UPDATE')
          $uninstaller = Join-Path (Split-Path -Parent $fresh) 'uninstall.exe'
          $result = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw 'Could not remove the clean-install fixture.' }
          Remove-Item -LiteralPath 'HKCU:\Software\Kelly Label Studio\Invoicer In' -Recurse -ErrorAction SilentlyContinue

          $legacyDir = Join-Path $env:RUNNER_TEMP 'Invoicer-in Beta 4 fixture'
          $legacyExe = Join-Path $legacyDir 'invoicer-in.exe'
          $legacyProduct = 'HKCU:\Software\Kelly Label Studio\Invoicer-in'
          $legacyUninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Invoicer-in'
          $legacyLink = Join-Path ([Environment]::GetFolderPath('Programs')) 'Invoicer-in.lnk'
          New-Item -ItemType Directory -Path $legacyDir | Out-Null
          Copy-Item 'src-tauri/target/release/invoicer-in.exe' $legacyExe
          Copy-Item $installer.FullName (Join-Path $legacyDir 'uninstall.exe')
          New-Item -Path $legacyProduct -Value $legacyDir -Force | Out-Null
          New-Item -Path $legacyUninstall -Force | Out-Null
          Set-ItemProperty -Path $legacyUninstall -Name MainBinaryName -Value 'invoicer-in.exe'
          Set-ItemProperty -Path $legacyUninstall -Name UninstallString -Value ('"' + (Join-Path $legacyDir 'uninstall.exe') + '"')
          $oldShortcut = $shell.CreateShortcut($legacyLink)
          $oldShortcut.TargetPath = $legacyExe
          $oldShortcut.Save()

          $dataDir = Join-Path $env:LOCALAPPDATA 'com.kellylabelstudio.gstinvoicedesk'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $canary = Join-Path $dataDir 'upgrade-check.txt'
          Set-Content -LiteralPath $canary -Value 'beta 4 records'
          $upgraded = Install-Invoicer -Flags @('/S', '/UPDATE')
          if ($upgraded -ne $legacyExe -or (Test-Path $legacyUninstall) -or (Test-Path $legacyLink)) {
            throw 'The rename did not migrate the previous installation in place.'
          }
          if ((Get-Content -LiteralPath $canary) -ne 'beta 4 records') { throw 'Upgrade changed the data directory.' }

          $app = Start-Process -FilePath $upgraded -PassThru
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              $app.Refresh()
              if ($app.HasExited -or $app.MainWindowTitle -eq 'Invoicer In') { break }
              Start-Sleep -Milliseconds 500
            }
            if ($app.HasExited -or $app.MainWindowTitle -ne 'Invoicer In') { throw 'The renamed desktop window did not open.' }
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class InvoicerDisplayCheck {
            [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
            [StructLayout(LayoutKind.Sequential)] public struct MonitorInfo { public int Size; public Rect Monitor, Work; public uint Flags; }
            [DllImport("user32.dll")] public static extern bool SetProcessDpiAwarenessContext(IntPtr context);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr window, out Rect bounds);
            [DllImport("user32.dll")] public static extern IntPtr MonitorFromWindow(IntPtr window, uint flags);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern bool GetMonitorInfo(IntPtr monitor, ref MonitorInfo info);
          }
          '@
            $null = [InvoicerDisplayCheck]::SetProcessDpiAwarenessContext([IntPtr](-4))
            $bounds = New-Object InvoicerDisplayCheck+Rect
            $monitor = New-Object InvoicerDisplayCheck+MonitorInfo
            $monitor.Size = [Runtime.InteropServices.Marshal]::SizeOf($monitor)
            $handle = [InvoicerDisplayCheck]::MonitorFromWindow($app.MainWindowHandle, 2)
            if (-not [InvoicerDisplayCheck]::GetWindowRect($app.MainWindowHandle, [ref]$bounds) -or
                -not [InvoicerDisplayCheck]::GetMonitorInfo($handle, [ref]$monitor)) {
              throw 'Could not inspect the visible startup window.'
            }
            if ($bounds.Left -lt $monitor.Work.Left -or $bounds.Top -lt $monitor.Work.Top -or
                $bounds.Right -gt $monitor.Work.Right -or $bounds.Bottom -gt $monitor.Work.Bottom) {
              throw 'The startup window extends outside the monitor work area.'
            }
            & powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File '.github/scripts/verify-appearance.ps1' -HandleValue ($app.MainWindowHandle.ToInt64()) -OutputDirectory (Join-Path $env:RUNNER_TEMP 'invoicer-visual-check')
            if ($LASTEXITCODE -ne 0) { throw 'Native appearance checks failed.' }
            Start-Sleep -Milliseconds 2000
            if (-not $app.CloseMainWindow() -or -not $app.WaitForExit(15000)) {
              throw 'The desktop window did not close after saving its draft.'
            }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: invoicer-in-windows-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoicer-in-visual-check
          path: ${{ runner.temp }}/invoicer-visual-check/*.png
          if-no-files-found: warn

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: invoicer-in-windows-x64
          path: installer
      - name: Draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INVOICE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$INVOICE_TAG" installer/*-setup.exe \
            --verify-tag --draft --prerelease --title "Invoicer In $INVOICE_TAG" \
            --notes "Windows x64 beta. See the project README for scope, setup and testing notes."
